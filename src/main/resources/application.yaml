server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: unified-backend
  autoconfigure:
    # Spring Security is only used by the Buy Together module, which has its own login
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: ${CHAT_MAX_FILE_SIZE:50MB}
      max-request-size: ${CHAT_MAX_REQUEST_SIZE:50MB}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://anmol:Mehla%406228@chat-service.3pp23dc.mongodb.net/coupon_voucher?authSource=admin&appName=Chat-Service}
      database: ${MONGODB_DATABASE:coupon_voucher}
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:true}
  mail:
    # used by Buy Together email OTP; port 587 because AWS blocks 25
    host: ${BT_MAIL_HOST:smtp.gmail.com}
    port: ${BT_MAIL_PORT:587}
    username: ${BT_MAIL_USERNAME:}
    password: ${BT_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:false}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: coupon-voucher-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# User Service: one login for every app
user-service:
  jwt:
    issuer: chronicle-user-service
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # RSA private key (base64 PKCS#8), only in the server env. Without it the app refuses to start,
    # unless USER_JWT_GENERATE_IF_MISSING=true (local runs only; tokens die on restart).
    private-key: ${USER_JWT_PRIVATE_KEY:}
    generate-if-missing: ${USER_JWT_GENERATE_IF_MISSING:false}
  login:
    max-failed-attempts: 5
    lock-duration: 15m

app:
  jwt:
    secret: ${JWT_SECRET:SuperLongHardcodedSecretKeySuperLongHardcodedSecretKeySuperLongHardcodedSecretKey1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # frontends allowed to call the user, blog and coupon APIs (comma separated, wildcards allowed)
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app}
  admin:
    user-ids: ${ADMIN_USER_IDS:1}
  chat-media:
    directory: ${CHAT_MEDIA_DIRECTORY:uploads/chat}
    public-base-url: ${CHAT_MEDIA_PUBLIC_BASE_URL:/uploads/chat}
  kafka:
    topics:
      coupon-create: ${KAFKA_COUPON_CREATE_TOPIC:coupon.create.requests}
  coupon-feed:
    enabled: ${COUPON_FEED_ENABLED:false}
    url: ${COUPON_FEED_URL:}
    fixed-delay-ms: ${COUPON_FEED_FIXED_DELAY_MS:300000}
    initial-delay-ms: ${COUPON_FEED_INITIAL_DELAY_MS:10000}
    max-dedupe-keys: ${COUPON_FEED_MAX_DEDUPE_KEYS:10000}
    default-seller-id: ${COUPON_FEED_DEFAULT_SELLER_ID:0}
    priceyuge-api-key: ${PRICEYUGE_API_KEY:}
    priceyuge-api-version: ${PRICEYUGE_API_VERSION:v1}
    priceyuge-store-tag: ${PRICEYUGE_STORE_TAG:}
    priceyuge-category-tag: ${PRICEYUGE_CATEGORY_TAG:}

# Buy Together module (com.buytogether). Every endpoint is served under /buy-together
buy-together:
  api-prefix: /buy-together
  jwt:
    # TEMPORARY test default, set BT_JWT_SECRET on the server before going live
    secret: ${BT_JWT_SECRET:buy-together-test-secret-key-change-me-before-live}
    ttl: ${BT_JWT_TTL:7d}
    issuer: buy-together
  otp:
    length: 6
    ttl: 5m
    resend-cooldown: 60s
    max-attempts: 5
    # log = print the OTP in the server log, twilio = send a real SMS
    sender: ${BT_OTP_SENDER:log}
    twilio:
      account-sid: ${BT_TWILIO_ACCOUNT_SID:}
      auth-token: ${BT_TWILIO_AUTH_TOKEN:}
      from-number: ${BT_TWILIO_FROM_NUMBER:}
    # log = print email OTPs in the server log, smtp = send real emails through spring.mail
    email-sender: ${BT_EMAIL_OTP_SENDER:log}
  google:
    # OAuth client id from Google Cloud Console; Google login is off while empty
    client-id: ${BT_GOOGLE_CLIENT_ID:}
  groups:
    min-size: 2
    max-size: 50
    max-open-per-user: 3
    max-deadline-days: 90
    purge-after-days: 30
    maintenance-cron: "0 5 0 * * *"
  cache:
    group:
      max-size: 5000
      ttl: 10m
    search:
      max-size: 500
      ttl: 30s
  cors:
    allowed-origins: ${BT_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}

# Email outreach: nightly job that marks contacts RESPONDED when they reply in Gmail
email-outreach:
  database: ${EMAIL_OUTREACH_DB:email_outreach}
  gmail:
    host: imap.gmail.com
    port: 993
    # same Gmail account and app password as the email OTP sender (BT_MAIL_* on the server)
    username: ${EMAIL_OUTREACH_GMAIL_USERNAME:${BT_MAIL_USERNAME:}}
    app-password: ${EMAIL_OUTREACH_GMAIL_APP_PASSWORD:${BT_MAIL_PASSWORD:}}
  reply-sync:
    enabled: true
    # every night at 2 AM India time
    cron: "0 0 2 * * *"
    zone: Asia/Kolkata
